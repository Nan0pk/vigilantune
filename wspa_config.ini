; ============================================================
; WinSCADA Power Agent (WSPA) Configuration
; ============================================================
; Place this file next to the agent executable.
; If not found, built-in defaults from config.hpp are used.
;
; Lines starting with ';' or '#' are comments.
; Sections are denoted by [section_name].
; Keys are case-insensitive.
; ============================================================

[general]
; Log level: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
log_level = INFO

; Enable telemetry CSV logging for model training
data_collection = false

; Path to the ONNX model file (relative to executable)
model_path = models/power_model.onnx

; Path for telemetry CSV output
telemetry_log_path = models/telemetry_log.csv

[controller]
; Main AI control loop interval bounds (milliseconds)
min_control_loop_interval_ms = 50
max_control_loop_interval_ms = 500

; Telemetry collection interval (milliseconds)
telemetry_interval_ms = 1000

; Change detection threshold (percentage)
dirty_flag_epsilon = 1.0

[deadband]
; Deadband thresholds control how much a value must change
; before it is written to the power subsystem.
; Lower values = more responsive but more writes.
high_stress = 1.0
medium_stress = 5.0
low_stress = 10.0

[stress_weights]
; Weights for Stress Score calculation (must sum to 1.0)
cpu = 0.30
queue = 0.40
thermal = 0.10
gpu = 0.10
disk = 0.10

[governor]
; Comma-separated list of processes to exclude from governance.
; These processes will never be throttled or moved to E-cores.
exclusion_list = explorer.exe,dwm.exe,lsass.exe,services.exe,csrss.exe,wininit.exe,smss.exe,agent.exe,watchdog.exe

; Governor scan interval (milliseconds)
governor_interval_ms = 10000

[watchdog]
; Maximum crash recovery attempts before giving up
max_recovery_attempts = 3

[telemetry_rotation]
; Maximum telemetry CSV file size in megabytes before rotation
max_file_size_mb = 50

; Maximum number of rotated log files to keep
max_rotated_files = 5
